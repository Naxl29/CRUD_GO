<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listado de Clientes</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/static/css/templates.css">
  </head>
  <body>
    <div class="container mt-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Listado de Clientes</h2>
        <button class="btn btn-success" data-toggle="modal" data-target="#crearClienteModal">
          <i class="fas fa-plus"></i> Nuevo Cliente
        </button>
      </div>

      <table class="table table-hover">
        <thead class="thead-dark">
          <tr>
            <th>ID</th>
            <th>ID Persona</th>
            <th>Tipo Cuenta</th>
            <th>Saldo</th>
            <th>Fecha Registro</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          {{range .}}
          <tr>
            <td>{{.ID}}</td>
            <td>{{.IDPersona}}</td>
            <td>{{.TipoCuenta}}</td>
            <td>${{printf "%.2f" .Saldo}}</td>
            <td>{{.FechaRegistro.Format "02/01/2006"}}</td>
            <td>
              <button class="btn btn-primary btn-sm" data-toggle="modal" data-target="#editarClienteModal" 
                      data-id="{{.ID}}" data-idpersona="{{.IDPersona}}" 
                      data-tipo="{{.TipoCuenta}}" data-saldo="{{.Saldo}}">
                <i class="fas fa-edit"></i>
              </button>
              <button class="btn btn-danger btn-sm" onclick="eliminarCliente({{.ID}})">
                <i class="fas fa-trash"></i>
              </button>
            </td>
          </tr>
          {{else}}
          <tr>
            <td colspan="6" class="text-center">No hay clientes registrados</td>
          </tr>
          {{end}}
        </tbody>
      </table>

      <!-- Modal Crear Cliente -->
      <div class="modal fade" id="crearClienteModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog" role="document">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Crear Nuevo Cliente</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <form action="/clientes/guardar" method="POST">
              <div class="modal-body">
                <div class="form-group">
                  <label>ID Persona</label>
                  <input type="number" name="idPersona" class="form-control" required>
                </div>
                <div class="form-group">
                  <label>Tipo de Cuenta</label>
                  <select name="tipoCuenta" class="form-control" required>
                    <option value="Ahorros">Ahorros</option>
                    <option value="Corriente">Corriente</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Saldo Inicial</label>
                  <input type="number" step="0.01" name="saldo" class="form-control" required>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-success">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Modal Editar Cliente -->
      <div class="modal fade" id="editarClienteModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog" role="document">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Editar Cliente</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <form action="/clientes/guardar" method="POST">
              <input type="hidden" name="id" id="editId">
              <div class="modal-body">
                <div class="form-group">
                  <label>ID Persona</label>
                  <input type="number" name="idPersona" id="editIdPersona" class="form-control" required>
                </div>
                <div class="form-group">
                  <label>Tipo de Cuenta</label>
                  <select name="tipoCuenta" id="editTipoCuenta" class="form-control" required>
                    <option value="Ahorros">Ahorros</option>
                    <option value="Corriente">Corriente</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Saldo</label>
                  <input type="number" step="0.01" name="saldo" id="editSaldo" class="form-control" required>
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Actualizar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

    <script>
      // Cargar datos en modal de edición
      $('#editarClienteModal').on('show.bs.modal', function (event) {
        var button = $(event.relatedTarget)
        var id = button.data('id')
        var idPersona = button.data('idpersona')
        var tipo = button.data('tipo')
        var saldo = button.data('saldo')
        
        var modal = $(this)
        modal.find('#editId').val(id)
        modal.find('#editIdPersona').val(idPersona)
        modal.find('#editTipoCuenta').val(tipo)
        modal.find('#editSaldo').val(saldo)
      })

      // Función eliminar
      function eliminarCliente(id) {
        if (confirm('¿Está seguro de eliminar este cliente?')) {
          window.location.href = '/clientes/eliminar?id=' + id
        }
      }
    </script>
  </body>
</html>
