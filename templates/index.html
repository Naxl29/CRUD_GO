<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Gestión de Cuentas</title>

    <!-- Bootstrap CSS desde CDN -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="/static/css/templates.css">
  </head>
  <body>
    <div class="container mt-5">
      <!-- Botones de navegación -->
      <div class="row mb-4">
        <div class="col-md-6">
          <a href="/personas" class="btn btn-success btn-block">
            <i class="fas fa-users"></i> Ver Personas
          </a>
        </div>
        <div class="col-md-6">
          <a href="/clientes" class="btn btn-success btn-block">
            <i class="fas fa-user-circle"></i> Ver Clientes
          </a>
        </div>
      </div>

      <h2 class="mb-4">Listado de Cuentas</h2>

      <table class="table table-hover">
        <thead class="thead-dark">
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Tipo de Cuenta</th>
            <th>Saldo</th>
          </tr>
        </thead>
        <tbody>
          {{range .Clientes}}
          <tr>
            <td>{{.ID}}</td>
            <td>{{.Persona.PrimerNombre}} {{.Persona.PrimerApellido}}</td>
            <td>{{.TipoCuenta}}</td>
            <td>${{printf "%.2f" .Saldo}}</td>
          </tr>
          {{else}}
          <tr>
            <td colspan="4" class="text-center">No hay cuentas registradas</td>
          </tr>
          {{end}}
        </tbody>
      </table>

    </div>

    <!-- Bootstrap JS y dependencias -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
  </body>
</html>
