<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Gestión de Cuentas</title>

    <!-- Bootstrap CSS desde CDN -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="/static/css/templates.css">
  </head>
  <body>

    <div class="container mt-5">
      <h2 class="mb-4">Listado de Cuentas</h2>

      <table class="table table-hover">
        <thead>
          <tr>
            <th>ID</th>
            <th>NOMBRE</th>
            <th>TIPO DE CUENTA</th>
            <th>MONTO</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>NICOLÁS</td>
            <td>AHORRO</td>
            <td>1000</td>
          </tr>
          <tr>
            <td>2</td>
            <td>ANA</td>
            <td>CORRIENTE</td>
            <td>2500</td>
          </tr>
          <tr>
            <td>3</td>
            <td>MARIO</td>
            <td>AHORRO</td>
            <td>1800</td>
          </tr>
        </tbody>
      </table>

      <button class="btn-enviar mt-3" data-toggle="modal" data-target="#enviarModal">Enviar Dinero</button>

      <!-- Modal para enviar dinero -->
      <div class="modal fade" id="enviarModal" tabindex="-1" role="dialog" aria-labelledby="enviarModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="enviarModalLabel">Enviar Dinero</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <form>
                <div class="form-group">
                  <label for="cuentaDestino">Cuenta Destino</label>
                  <input type="text" class="form-control" id="cuentaDestino" placeholder="Ingrese número de cuenta">
                </div>
                <div class="form-group">
                  <label for="montoEnviar">Monto</label>
                  <input type="number" class="form-control" id="montoEnviar" placeholder="Ingrese el monto">
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
              <button type="button" class="btn btn-primary">Enviar</button>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- Bootstrap JS y dependencias -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>

    <!-- JS personalizado -->
    <script src="/static/js/main.js"></script>

  </body>
</html>
